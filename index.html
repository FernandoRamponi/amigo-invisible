<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Invisible</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo: copos de nieve -->
  <div id="fondo" aria-hidden="true"></div>

  <main class="contenedor">
    <h1>🎁 Amigo Invisible 🎁</h1>

    <section class="tarjeta tarjeta-sorteo">
      <p id="etiqueta-quien" class="etiqueta">¿Quién sos?</p>
      <div id="selector" class="selector">
        <button type="button" id="selector-boton" class="selector-boton"
                aria-haspopup="listbox" aria-expanded="false" aria-labelledby="etiqueta-quien selector-texto" disabled>
          <span id="selector-inicial" class="inicial oculto"></span>
          <span id="selector-texto" class="selector-texto">Cargando participantes...</span>
          <span class="selector-flecha" aria-hidden="true">▾</span>
        </button>
        <ul id="selector-lista" class="selector-lista" role="listbox" aria-labelledby="etiqueta-quien" hidden></ul>
      </div>

      <div id="ruleta" class="ruleta">
        <span id="nombre-actual">¿Quién te toca?</span>
      </div>

      <button id="btn-sortear" class="btn btn-principal" disabled>🎲 Sortear</button>
      <p id="mensaje" class="mensaje"></p>
    </section>

    <!-- Mini Santa: 3D con santa3d.js (salta, se agarra de la tarjeta y se cae); si no hay 3D, queda este dibujo plano -->
    <div class="santa-baile" aria-hidden="true" title="¡Tocalo!">
      <svg class="santa-svg" viewBox="0 0 200 260" width="190" height="247">
        <ellipse class="sombra" cx="100" cy="248" rx="52" ry="7" />
        <g class="santa">
          <!-- Piernas -->
          <g class="pierna pierna-izq">
            <rect x="74" y="160" width="22" height="54" rx="9" fill="#a70f26" />
            <rect x="64" y="206" width="34" height="18" rx="9" fill="#1d1d1d" />
          </g>
          <g class="pierna pierna-der">
            <rect x="104" y="160" width="22" height="54" rx="9" fill="#a70f26" />
            <rect x="102" y="206" width="34" height="18" rx="9" fill="#1d1d1d" />
          </g>
          <!-- Brazos -->
          <g class="brazo brazo-izq">
            <rect x="26" y="104" width="42" height="19" rx="9.5" fill="#d4142f" />
            <rect x="24" y="102" width="11" height="23" rx="5" fill="#fff" />
            <circle cx="19" cy="113.5" r="10" fill="#1d1d1d" />
          </g>
          <g class="brazo brazo-der">
            <rect x="132" y="104" width="42" height="19" rx="9.5" fill="#d4142f" />
            <rect x="165" y="102" width="11" height="23" rx="5" fill="#fff" />
            <circle cx="181" cy="113.5" r="10" fill="#1d1d1d" />
          </g>
          <!-- Cuerpo -->
          <ellipse cx="100" cy="138" rx="48" ry="46" fill="#d4142f" />
          <rect x="94" y="96" width="12" height="84" fill="#fff" />
          <rect x="56" y="170" width="88" height="13" rx="6.5" fill="#fff" />
          <rect x="53" y="146" width="94" height="13" fill="#1d1d1d" />
          <rect x="87" y="143" width="26" height="19" rx="3" fill="none" stroke="#f4c542" stroke-width="4" />
          <!-- Cabeza -->
          <g class="cabeza">
            <circle cx="100" cy="72" r="27" fill="#f6c9a8" />
            <circle cx="84" cy="77" r="5" fill="#f28b8b" opacity="0.55" />
            <circle cx="116" cy="77" r="5" fill="#f28b8b" opacity="0.55" />
            <path d="M71 66 Q68 106 100 122 Q132 106 129 66 Q116 88 100 88 Q84 88 71 66 Z" fill="#fff" />
            <ellipse class="boca" cx="100" cy="95" rx="5" ry="4" fill="#7a1020" />
            <ellipse cx="91" cy="86" rx="10" ry="5.5" fill="#fff" />
            <ellipse cx="109" cy="86" rx="10" ry="5.5" fill="#fff" />
            <circle cx="100" cy="79" r="5.5" fill="#e89a78" />
            <circle class="ojo" cx="90" cy="66" r="3" fill="#2b1d14" />
            <circle class="ojo" cx="110" cy="66" r="3" fill="#2b1d14" />
            <g class="gorro">
              <path d="M73 47 Q90 4 142 16 Q122 26 127 47 Z" fill="#d4142f" />
              <rect x="68" y="42" width="64" height="13" rx="6.5" fill="#fff" />
              <circle cx="144" cy="17" r="9" fill="#fff" />
            </g>
          </g>
        </g>
      </svg>
    </div>

    <p id="aviso-demo" class="aviso-demo oculto">
      Modo prueba: todavía no está conectado el Apps Script (ver INSTRUCCIONES.md).
    </p>
  </main>

  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="santa3d.js"></script>
</body>
</html>
