<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Invisible</title>
  <style>:root {
  --rojo: #c8102e;
  --rojo-oscuro: #8b0a1f;
  --verde: #1e7a46;
  --dorado: #f4c542;
  --crema: #fff8ec;
  --texto: #2b1d14;
  --gris: #7a6a58;
  --fondo-1: #0f2a1d;
  --fondo-2: #071510;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: var(--texto);
  background: radial-gradient(circle at top, var(--fondo-1), var(--fondo-2));
  overflow-x: hidden;
}

/* Capa de fondo (copos de nieve por ahora; después el Santa) */
#fondo {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.copo {
  position: absolute;
  top: -20px;
  color: #fff;
  opacity: 0.8;
  animation: caer linear infinite;
}
@keyframes caer {
  to { transform: translateY(110vh) rotate(360deg); }
}

.contenedor {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

h1 {
  text-align: center;
  color: #fff;
  font-size: 2.2rem;
  text-shadow: 0 3px 0 var(--rojo-oscuro), 0 0 18px rgba(244, 197, 66, 0.5);
  margin: 8px 0 24px;
}

.tarjeta {
  background: var(--crema);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  border: 3px solid var(--dorado);
}

.oculto { display: none; }

/* ¿Quién sos? */
.etiqueta {
  display: block;
  font-weight: 700;
  color: var(--verde);
  margin-bottom: 8px;
  font-size: 1.1rem;
}
/* Menú de nombres */
.selector {
  position: relative;
  margin-bottom: 18px;
  text-align: left;
}

.selector-boton {
  --c: var(--verde);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 10px 16px;
  font: inherit;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--texto);
  background: #fff;
  border: 2px solid var(--c);
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #000), 0 0 0 0 transparent;
  transition: box-shadow 0.25s, transform 0.1s, border-color 0.25s;
}
.selector-boton:hover:not(:disabled),
.selector-boton:focus-visible {
  outline: none;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #000), 0 0 18px 2px color-mix(in srgb, var(--c) 55%, transparent);
}
.selector-boton:active:not(:disabled) { transform: translateY(2px); }
.selector-boton:disabled { cursor: wait; opacity: 0.75; }
.selector-boton.elegido { background: color-mix(in srgb, var(--c) 10%, #fff); }
.selector-boton.elegido::after { animation-duration: 2.8s; }

.selector-texto { flex: 1; }
.selector-flecha {
  font-size: 1.3rem;
  color: var(--c);
  transition: transform 0.25s;
}
.selector.abierto .selector-flecha { transform: rotate(180deg); }

.selector-lista {
  position: absolute;
  z-index: 20;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  margin: 0;
  padding: 8px;
  list-style: none;
  max-height: min(60vh, 470px);
  overflow-y: auto;
  background: #1a0f0a;
  border: 2px solid var(--dorado);
  border-radius: 16px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 24px rgba(244, 197, 66, 0.25);
  animation: lista-abrir 0.22s ease-out;
  scrollbar-width: thin;
  scrollbar-color: var(--dorado) transparent;
}
.selector-lista[hidden] { display: none; }
@keyframes lista-abrir {
  from { opacity: 0; transform: translateY(-8px) scale(0.97); }
}

.opcion {
  --c: #fff;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 6px;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 700;
  text-align: left;
  color: #fff;
  background: color-mix(in srgb, var(--c) 14%, #1a0f0a);
  border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent);
  border-radius: 12px;
  cursor: pointer;
  opacity: 0;
  animation: opcion-entrar 0.3s ease-out forwards;
  animation-delay: calc(var(--i) * 35ms);
  transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
}
.opcion:last-child { margin-bottom: 0; }
.opcion:hover,
.opcion:focus-visible {
  outline: none;
  background: color-mix(in srgb, var(--c) 32%, #1a0f0a);
  box-shadow: 0 0 16px 1px color-mix(in srgb, var(--c) 60%, transparent), inset 0 0 0 1px var(--c);
  transform: translateX(4px);
}
.opcion[aria-selected="true"] {
  background: color-mix(in srgb, var(--c) 40%, #1a0f0a);
  box-shadow: inset 0 0 0 2px var(--c);
}
@keyframes opcion-entrar {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: none; }
}

/* Barrido de luz (del color de cada nombre) */
.opcion::after,
.selector-boton.elegido::after {
  content: "";
  position: absolute;
  top: -20%;
  bottom: -20%;
  left: -45%;
  width: 40%;
  pointer-events: none;
  background: linear-gradient(100deg,
    transparent 0%,
    color-mix(in srgb, var(--c) 70%, transparent) 45%,
    rgba(255, 255, 255, 0.85) 50%,
    color-mix(in srgb, var(--c) 70%, transparent) 55%,
    transparent 100%);
  transform: skewX(-18deg);
  mix-blend-mode: screen;
  animation: barrido 2.2s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * 0.18s);
}
.selector-boton.elegido::after { mix-blend-mode: normal; opacity: 0.55; }
@keyframes barrido {
  0% { left: -45%; }
  55%, 100% { left: 120%; }
}

.inicial {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 1rem;
  font-weight: 800;
  color: #1a0f0a;
  background: var(--c);
  box-shadow: 0 0 12px color-mix(in srgb, var(--c) 80%, transparent);
}
.inicial.oculto { display: none; }

/* Botones */
.btn {
  border: none;
  cursor: pointer;
  font-weight: 700;
  border-radius: 10px;
  transition: transform 0.1s, filter 0.2s;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-principal {
  display: block;
  width: 100%;
  background: var(--rojo);
  color: #fff;
  font-size: 1.4rem;
  padding: 16px;
  box-shadow: 0 5px 0 var(--rojo-oscuro);
}
.btn-principal:hover:not(:disabled) { filter: brightness(1.1); }
.btn-principal:active:not(:disabled) { box-shadow: 0 2px 0 var(--rojo-oscuro); transform: translateY(3px); }

/* Ruleta */
.tarjeta-sorteo { text-align: center; }

.ruleta {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  border-radius: 12px;
  background: repeating-linear-gradient(45deg, var(--rojo) 0 14px, #fff 14px 28px);
  padding: 8px;
}
#nombre-actual {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background: var(--crema);
  border-radius: 8px;
  font-size: 2rem;
  font-weight: 800;
  color: var(--texto);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 10px;
}
.ruleta.girando #nombre-actual { color: #9a8a78; }
.ruleta.ganador #nombre-actual {
  color: var(--rojo);
  animation: pop 0.5s ease-out;
}
.ruleta.ganador {
  animation: brillo 1s ease-in-out 3;
}
@keyframes pop {
  0% { transform: scale(0.6); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
@keyframes brillo {
  50% { box-shadow: 0 0 30px 8px var(--dorado); }
}

.mensaje {
  min-height: 1.4em;
  margin: 16px 0 0;
  font-weight: 600;
  color: var(--verde);
}
.mensaje.error { color: var(--rojo); }

.aviso-demo {
  text-align: center;
  color: var(--dorado);
  font-size: 0.85rem;
}

/* Santa bailando */
.santa-baile {
  position: relative;
  display: flex;
  justify-content: center;
  margin: 4px 0 12px;
  z-index: 0;
}
.santa-svg { max-width: 60vw; height: auto; overflow: visible; }

.santa-3d {
  display: none;
  width: 300px;
  height: 300px;
  max-width: 82vw;
  max-height: 82vw;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.santa-baile.con-3d .santa-svg { display: none; }
.santa-baile.con-3d .santa-3d { display: block; }
.santa-baile.con-3d { margin-top: -12px; }

.santa { transform-origin: 100px 230px; animation: santa-rebote 0.5s ease-in-out infinite alternate; }
.sombra { fill: rgba(0, 0, 0, 0.35); transform-origin: 100px 248px; animation: sombra 0.5s ease-in-out infinite alternate; }
.pierna-izq { transform-origin: 85px 165px; animation: pierna-izq 0.5s ease-in-out infinite alternate; }
.pierna-der { transform-origin: 115px 165px; animation: pierna-der 0.5s ease-in-out infinite alternate; }
.brazo-izq { transform-origin: 64px 113px; animation: brazo-izq 0.25s ease-in-out infinite alternate; }
.brazo-der { transform-origin: 136px 113px; animation: brazo-der 0.25s ease-in-out infinite alternate; animation-delay: -0.125s; }
.cabeza { transform-origin: 100px 98px; animation: cabeza 0.5s ease-in-out infinite alternate; }
.gorro { transform-origin: 100px 48px; animation: gorro 0.5s ease-in-out infinite alternate-reverse; }
.boca { transform-origin: 100px 95px; animation: boca 0.25s ease-in-out infinite alternate; }
.ojo { transform-box: fill-box; transform-origin: center; animation: parpadeo 3.5s infinite; }

@keyframes santa-rebote {
  from { transform: translateY(0) rotate(-5deg); }
  to { transform: translateY(-14px) rotate(5deg); }
}
@keyframes sombra {
  from { transform: scaleX(1); opacity: 1; }
  to { transform: scaleX(0.75); opacity: 0.6; }
}
@keyframes pierna-izq {
  from { transform: rotate(0deg); }
  to { transform: rotate(28deg); }
}
@keyframes pierna-der {
  from { transform: rotate(-28deg); }
  to { transform: rotate(0deg); }
}
@keyframes brazo-izq {
  from { transform: rotate(25deg); }
  to { transform: rotate(-45deg); }
}
@keyframes brazo-der {
  from { transform: rotate(-25deg); }
  to { transform: rotate(45deg); }
}
@keyframes cabeza {
  from { transform: rotate(6deg); }
  to { transform: rotate(-6deg); }
}
@keyframes gorro {
  from { transform: rotate(-10deg); }
  to { transform: rotate(8deg); }
}
@keyframes boca {
  from { transform: scaleY(0.5); }
  to { transform: scaleY(1.2); }
}
@keyframes parpadeo {
  0%, 92%, 100% { transform: scaleY(1); }
  95% { transform: scaleY(0.1); }
}

.nota {
  position: absolute;
  bottom: 55%;
  font-size: 1.6rem;
  font-weight: 700;
  opacity: 0;
  animation: nota-flotar 2.4s ease-out infinite;
}
.nota-1 { left: calc(50% - 115px); color: #f4c542; }
.nota-2 { left: calc(50% + 90px); color: #4fd1ff; animation-delay: 0.8s; }
.nota-3 { left: calc(50% - 80px); color: #ff6fb5; animation-delay: 1.6s; }
@keyframes nota-flotar {
  0% { opacity: 0; transform: translateY(0) rotate(-10deg); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-70px) rotate(15deg); }
}

@media (prefers-reduced-motion: reduce) {
  .santa, .sombra, .pierna, .brazo, .cabeza, .gorro, .boca, .ojo, .nota,
  .opcion::after, .selector-boton.elegido::after { animation: none; }
  .opcion { opacity: 1; animation: none; }
}

/* Confeti */
.confeti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 14px;
  z-index: 10;
  pointer-events: none;
  animation: confeti-caer 2.5s ease-in forwards;
}
@keyframes confeti-caer {
  to { transform: translateY(105vh) rotate(720deg); opacity: 0.7; }
}
</style>
</head>
<body>
  <!-- Fondo: copos de nieve -->
  <div id="fondo" aria-hidden="true"></div>

  <main class="contenedor">
    <h1>🎁 Amigo Invisible 🎁</h1>

    <section class="tarjeta tarjeta-sorteo">
      <p id="etiqueta-quien" class="etiqueta">¿Quién sos?</p>
      <div id="selector" class="selector">
        <button type="button" id="selector-boton" class="selector-boton"
                aria-haspopup="listbox" aria-expanded="false" aria-labelledby="etiqueta-quien selector-texto" disabled>
          <span id="selector-inicial" class="inicial oculto"></span>
          <span id="selector-texto" class="selector-texto">Cargando participantes...</span>
          <span class="selector-flecha" aria-hidden="true">▾</span>
        </button>
        <ul id="selector-lista" class="selector-lista" role="listbox" aria-labelledby="etiqueta-quien" hidden></ul>
      </div>

      <div id="ruleta" class="ruleta">
        <span id="nombre-actual">¿Quién te toca?</span>
      </div>

      <button id="btn-sortear" class="btn btn-principal" disabled>🎲 Sortear</button>
      <p id="mensaje" class="mensaje"></p>
    </section>

    <!-- Mini Santa bailando: 3D con santa3d.js; si no hay 3D, queda este dibujo plano -->
    <div class="santa-baile" aria-hidden="true" title="¡Tocalo!">
      <span class="nota nota-1">♪</span>
      <span class="nota nota-2">♫</span>
      <span class="nota nota-3">♪</span>
      <svg class="santa-svg" viewBox="0 0 200 260" width="190" height="247">

          </g>
          <!-- Brazos -->
          <g class="brazo brazo-izq">
            <rect x="26" y="104" width="42" height="19" rx="9.5" fill="#d4142f" />

          </g>
          <g class="brazo brazo-der">
            <rect x="132" y="104" width="42" height="19" rx="9.5" fill="#d4142f" />
            <rect x="165" y="102" width="11" height="23" rx="5" fill="#fff" />
            <circle cx="181" cy="113.5" r="10" fill="#1d1d1d" />
          </g>
          <!-- Cuerpo -->
          <ellipse cx="100" cy="138" rx="48" ry="46" fill="#d4142f" />
          <rect x="94" y="96" width="12" height="84" fill="#fff" />
          <rect x="56" y="170" width="88" height="13" rx="6.5" fill="#fff" />
          <rect x="53" y="146" width="94" height="13" fill="#1d1d1d" />
          <rect x="87" y="143" width="26" height="19" rx="3" fill="none" stroke="#f4c542" stroke-width="4" />
          <!-- Cabeza -->
          <g class="cabeza">
            <circle cx="100" cy="72" r="27" fill="#f6c9a8" />
            <circle cx="84" cy="77" r="5" fill="#f28b8b" opacity="0.55" />
            <circle cx="116" cy="77" r="5" fill="#f28b8b" opacity="0.55" />

              <path d="M73 47 Q90 4 142 16 Q122 26 127 47 Z" fill="#d4142f" />

    </div>

    <p id="aviso-demo" class="aviso-demo oculto">
      Modo prueba: todavía no está conectado el Apps Script (ver INSTRUCCIONES.md).

  </main>

  <script>// =====================================================
// CONFIGURACIÓN
// Pegá acá la URL de tu Apps Script (termina en /exec).
// Si queda vacía, la web funciona en "modo prueba" con nombres de ejemplo.
// =====================================================
const SCRIPT_URL = "";

const MODO_DEMO = !SCRIPT_URL;
const CLAVE_RESULTADO = "amigo-invisible-resultado";

// ---------- Elementos ----------
const selector = document.getElementById("selector");
const selectorBoton = document.getElementById("selector-boton");
const selectorTexto = document.getElementById("selector-texto");
const selectorInicial = document.getElementById("selector-inicial");
const selectorLista = document.getElementById("selector-lista");
const ruleta = document.getElementById("ruleta");
const nombreActual = document.getElementById("nombre-actual");
const btnSortear = document.getElementById("btn-sortear");
const mensaje = document.getElementById("mensaje");
const avisoDemo = document.getElementById("aviso-demo");

let participantes = [];
let quienElegido = "";

// Un color de luz distinto para cada nombre (se repiten si hay más de 12).
const COLORES_NOMBRES = [
  "#ff4d6d", "#ffc93c", "#3ddc84", "#4fd1ff", "#b388ff", "#ff8a3d",
  "#ff6fb5", "#7cf5e0", "#c6ff4d", "#6e8bff", "#ff5ce1", "#ffe066",
];
function colorDe(nombre) {
  const i = participantes.indexOf(nombre);
  return COLORES_NOMBRES[(i < 0 ? 0 : i) % COLORES_NOMBRES.length];
}

// ---------- Comunicación con el Apps Script ----------
async function api(params) {
  if (MODO_DEMO) return apiDemo(params);
  const url = SCRIPT_URL + "?" + new URLSearchParams(params);
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("El servidor respondió " + resp.status);
  return resp.json();
}

// Simulación local para probar sin Apps Script
const demo = { nombres: ["Fernando","Juani","Flor","Alejandra","Beti","Nacho","Daniela","Ezequiel","Caro","Charli"], asignaciones: null, sorteados: [] };
async function apiDemo(params) {
  await new Promise(r => setTimeout(r, 800));
  if (params.accion === "participantes") return { ok: true, participantes: demo.nombres };
  if (params.accion === "sortear") {
    if (!demo.asignaciones) {
      const s = [...demo.nombres].sort(() => Math.random() - 0.5);
      demo.asignaciones = {};
      s.forEach((n, i) => { demo.asignaciones[n] = s[(i + 1) % s.length]; });
    }
    if (demo.sorteados.includes(params.nombre)) return { ok: true, yaSorteo: true };
    demo.sorteados.push(params.nombre);
    console.log(`[demo] Mail al organizador: "${params.nombre} ya hizo su sorteo (${demo.sorteados.length} de ${demo.nombres.length})"`);
    return { ok: true, yaSorteo: false, teToca: demo.asignaciones[params.nombre] };
  }
  return { ok: false, error: "Acción desconocida" };
}

// ---------- Guardado local del resultado ----------
function leerResultado() {
  try { return JSON.parse(localStorage.getItem(CLAVE_RESULTADO)); } catch (e) { return null; }
}
function guardarResultado(nombre, teToca) {
  try { localStorage.setItem(CLAVE_RESULTADO, JSON.stringify({ nombre, teToca })); } catch (e) { /* ignorar */ }
}

// ---------- UI ----------
function mostrarMensaje(texto, esError = false) {
  mensaje.textContent = texto;
  mensaje.classList.toggle("error", esError);
}

function aleatorio(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function mostrarGanador(nombre) {
  nombreActual.textContent = nombre;
  ruleta.classList.remove("girando");
  void ruleta.offsetWidth; // reinicia la animación
  ruleta.classList.add("ganador");
}

// Hace girar los nombres hasta que se llame a parar(nombreFinal).
// Gira rápido mientras espera la respuesta y después frena de a poco.
function girar(nombresGiro) {
  let delay = 50;
  let final = null;
  let frenando = false;
  let cancelado = false;
  let anterior = null;
  let resolver;
  const inicio = Date.now();
  const terminado = new Promise(r => (resolver = r));

  ruleta.classList.remove("ganador");
  ruleta.classList.add("girando");

  function tick() {
    if (cancelado) return;
    if (frenando && delay >= 450) {
      mostrarGanador(final);
      resolver();
      return;
    }
    let n = aleatorio(nombresGiro);
    if (nombresGiro.length > 1) while (n === anterior) n = aleatorio(nombresGiro);
    anterior = n;
    nombreActual.textContent = n;

    if (frenando) delay *= 1.12;
    else if (final !== null && Date.now() - inicio > 1500) frenando = true;
    setTimeout(tick, delay);
  }
  tick();

  return {
    parar(nombreFinal) { final = nombreFinal; return terminado; },
    cancelar(texto) {
      cancelado = true;
      ruleta.classList.remove("girando");
      nombreActual.textContent = texto;
    },
  };
}

function bloquear() {
  cerrarLista();
  selectorBoton.disabled = true;
  btnSortear.disabled = true;
}

// ---------- Menú de nombres ----------
function armarLista() {
  selectorLista.innerHTML = "";
  participantes.forEach((n, i) => {
    const li = document.createElement("li");
    li.setAttribute("role", "presentation");
    const op = document.createElement("button");
    op.type = "button";
    op.className = "opcion";
    op.setAttribute("role", "option");
    op.setAttribute("aria-selected", "false");
    op.dataset.nombre = n;
    op.style.setProperty("--c", colorDe(n));
    op.style.setProperty("--i", i);
    op.innerHTML = '<span class="inicial"></span><span></span>';
    op.firstChild.textContent = n.charAt(0).toUpperCase();
    op.lastChild.textContent = n;
    op.addEventListener("click", () => elegir(n, true));
    li.appendChild(op);
    selectorLista.appendChild(li);
  });
}

function opciones() {
  return [...selectorLista.querySelectorAll(".opcion")];
}

function abrirLista() {
  if (selectorBoton.disabled) return;
  selectorLista.hidden = false;
  selector.classList.add("abierto");
  selectorBoton.setAttribute("aria-expanded", "true");
  // Reinicia la animación de entrada de cada nombre
  opciones().forEach(op => { op.style.animation = "none"; void op.offsetWidth; op.style.animation = ""; });
  const actual = opciones().find(op => op.dataset.nombre === quienElegido) || opciones()[0];
  if (actual) actual.focus({ preventScroll: true });
}

function cerrarLista(volverAlBoton = false) {
  if (selectorLista.hidden) return;
  selectorLista.hidden = true;
  selector.classList.remove("abierto");
  selectorBoton.setAttribute("aria-expanded", "false");
  if (volverAlBoton) selectorBoton.focus();
}

function elegir(nombre, desdeLista = false) {
  quienElegido = nombre;
  const color = colorDe(nombre);
  selectorTexto.textContent = nombre;
  selectorInicial.textContent = nombre.charAt(0).toUpperCase();
  selectorInicial.classList.remove("oculto");
  selectorBoton.style.setProperty("--c", color);
  selectorBoton.classList.add("elegido");
  opciones().forEach(op => op.setAttribute("aria-selected", String(op.dataset.nombre === nombre)));
  if (mensaje.classList.contains("error")) mostrarMensaje("");
  cerrarLista(desdeLista);
}

selectorBoton.addEventListener("click", () => {
  if (selectorLista.hidden) abrirLista();
  else cerrarLista();
});

selectorBoton.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    abrirLista();
  }
});

selectorLista.addEventListener("keydown", e => {
  const ops = opciones();
  const i = ops.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); ops[(i + 1) % ops.length].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); ops[(i - 1 + ops.length) % ops.length].focus(); }
  else if (e.key === "Home") { e.preventDefault(); ops[0].focus(); }
  else if (e.key === "End") { e.preventDefault(); ops[ops.length - 1].focus(); }
  else if (e.key === "Escape" || e.key === "Tab") { cerrarLista(e.key === "Escape"); }
});

document.addEventListener("click", e => {
  if (!selector.contains(e.target)) cerrarLista();
});

// ---------- Sorteo ----------
async function sortear() {
  const quien = quienElegido;
  if (!quien) {
    mostrarMensaje("Primero elegí tu nombre 👆", true);
    return;
  }
  bloquear();
  mostrarMensaje("");

  const otros = participantes.filter(n => n !== quien);
  const giro = girar(otros.length ? otros : participantes);

  try {
    const res = await api({ accion: "sortear", nombre: quien });
    if (!res.ok) throw new Error(res.error || "Algo salió mal");

    if (res.yaSorteo) {
      giro.cancelar("🤔");
      mostrarMensaje(`${quien}, vos ya hiciste tu sorteo. Si no fuiste vos, avisale al organizador.`, true);
      return;
    }

    await giro.parar(res.teToca);
    guardarResultado(quien, res.teToca);
    mostrarMensaje(`¡${quien}, te toca regalarle a ${res.teToca}! 🤫 No le digas a nadie.`);
    lanzarConfeti();
  } catch (err) {
    giro.cancelar("😕");
    mostrarMensaje("No se pudo sortear: " + err.message + ". Probá de nuevo.", true);
    selectorBoton.disabled = false;
    btnSortear.disabled = false;
  }
}

// ---------- Efectos ----------
function lanzarConfeti() {
  const colores = ["#c8102e", "#1e7a46", "#f4c542", "#ffffff"];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confeti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = aleatorio(colores);
    c.style.animationDelay = Math.random() * 0.6 + "s";
    c.style.animationDuration = 2 + Math.random() * 1.5 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

function crearNieve() {
  const fondo = document.getElementById("fondo");
  for (let i = 0; i < 40; i++) {
    const copo = document.createElement("span");
    copo.className = "copo";
    copo.textContent = "❄";
    copo.style.left = Math.random() * 100 + "vw";
    copo.style.fontSize = 8 + Math.random() * 14 + "px";
    copo.style.animationDuration = 6 + Math.random() * 10 + "s";
    copo.style.animationDelay = -Math.random() * 16 + "s";
    fondo.appendChild(copo);
  }
}

// ---------- Inicio ----------
async function iniciar() {
  crearNieve();
  avisoDemo.classList.toggle("oculto", !MODO_DEMO);

  // Si este dispositivo ya sorteó, mostrar el resultado directamente
  const previo = leerResultado();

  try {
    const res = await api({ accion: "participantes" });
    if (!res.ok) throw new Error(res.error);
    participantes = res.participantes;
  } catch (err) {
    selectorTexto.textContent = "No se pudo cargar";
    mostrarMensaje("No se pudo conectar con el sorteo. Recargá la página.", true);
    return;
  }

  selectorTexto.textContent = "Elegí tu nombre";
  armarLista();

  if (previo && participantes.includes(previo.nombre)) {
    elegir(previo.nombre);
    mostrarGanador(previo.teToca);
    mostrarMensaje(`${previo.nombre}, ya sorteaste: te toca ${previo.teToca} 🎁`);
    bloquear();
    return;
  }

  selectorBoton.disabled = false;
  btnSortear.disabled = false;
}

btnSortear.addEventListener("click", sortear);
iniciar();
</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>// =====================================================
// MINI SANTA 3D bailando (Three.js)
// Un Santa petiso y cabezón que mueve la cadera, rebota y gira en círculos
// sobre una pista de baile con luces de colores. Tocalo para que haga un giro.
// Si el navegador no soporta 3D, queda el Santa plano (SVG) de respaldo.
// =====================================================
(function () {
  const contenedor = document.querySelector(".santa-baile");
  if (!contenedor || typeof THREE === "undefined") return;

  // ¿Hay WebGL?
  try {
    const prueba = document.createElement("canvas");
    if (!(prueba.getContext("webgl") || prueba.getContext("experimental-webgl"))) return;
  } catch (e) { return; }

  const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Escena ----------
  const canvas = document.createElement("canvas");
  canvas.className = "santa-3d";
  canvas.setAttribute("aria-hidden", "true");
  contenedor.appendChild(canvas);
  contenedor.classList.add("con-3d");

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const escena = new THREE.Scene();
  const camara = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
  camara.position.set(0, 1.55, 5.2);
  camara.lookAt(0, 0.75, 0);

  escena.add(new THREE.HemisphereLight(0xfff4e0, 0x203040, 0.55));
  const sol = new THREE.DirectionalLight(0xffffff, 0.6);
  sol.position.set(2, 4, 3);
  escena.add(sol);

  // Luces de boliche que giran alrededor
  const coloresDisco = [0xff3d7f, 0x3dd6ff, 0xffd23d, 0x7dff6a];
  const lucesDisco = coloresDisco.map(c => {
    const l = new THREE.PointLight(c, 0.45, 5);
    escena.add(l);
    return l;
  });

  // ---------- Materiales ----------
  const mat = c => new THREE.MeshToonMaterial({ color: c });
  const rojo = mat(0xe01b34);
  const rojoOscuro = mat(0xa8102a);
  const blanco = mat(0xffffff);
  const piel = mat(0xffcfae);
  const negro = mat(0x1e1e24);
  const dorado = mat(0xffc93c);
  const rosa = new THREE.MeshToonMaterial({ color: 0xff8a9a, transparent: true, opacity: 0.7 });
  const verde = mat(0x1e9a55);

  const esfera = (r, m, seg = 24) => new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75)), m);

  // ---------- Pista de baile ----------
  const pista = new THREE.Mesh(
    new THREE.CircleGeometry(1.35, 48),
    new THREE.MeshBasicMaterial({ color: 0xff3d7f, transparent: true, opacity: 0.18 })
  );
  pista.rotation.x = -Math.PI / 2;
  escena.add(pista);

  const aro = new THREE.Mesh(
    new THREE.RingGeometry(1.3, 1.38, 64),
    new THREE.MeshBasicMaterial({ color: 0xffd23d, transparent: true, opacity: 0.55 })
  );
  aro.rotation.x = -Math.PI / 2;
  aro.position.y = 0.002;
  escena.add(aro);

  // Sombra suave (textura dibujada en un canvas)
  const sombraTex = (() => {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, "rgba(0,0,0,0.55)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  const sombra = new THREE.Mesh(
    new THREE.PlaneGeometry(1.1, 1.1),
    new THREE.MeshBasicMaterial({ map: sombraTex, transparent: true, depthWrite: false })
  );
  sombra.rotation.x = -Math.PI / 2;
  sombra.position.y = 0.004;
  escena.add(sombra);

  // ---------- Mini Santa ----------
  const santa = new THREE.Group();      // se mueve en círculo y gira
  const rebote = new THREE.Group();     // salta al ritmo
  santa.add(rebote);
  escena.add(santa);

  // Piernas (cortitas)
  function pierna(lado) {
    const g = new THREE.Group();
    g.position.set(0.17 * lado, 0.36, 0);
    const muslo = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.11, 0.26, 16), rojoOscuro);
    muslo.position.y = -0.13;
    const bota = esfera(0.14, negro);
    bota.scale.set(1, 0.65, 1.45);
    bota.position.set(0, -0.28, 0.06);
    g.add(muslo, bota);
    rebote.add(g);
    return g;
  }
  const piernaIzq = pierna(-1);
  const piernaDer = pierna(1);

  // Cadera: todo lo de arriba cuelga de acá (para el meneo)
  const cadera = new THREE.Group();
  cadera.position.y = 0.36;
  rebote.add(cadera);

  // Panza
  const panza = esfera(0.42, rojo, 32);
  panza.scale.set(1.05, 0.95, 1);
  panza.position.y = 0.3;
  const borde = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.075, 12, 40), blanco);
  borde.rotation.x = Math.PI / 2;
  borde.position.y = 0.04;
  const cinturon = new THREE.Mesh(new THREE.TorusGeometry(0.43, 0.045, 10, 40), negro);
  cinturon.rotation.x = Math.PI / 2;
  cinturon.position.y = 0.24;
  const hebilla = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.12, 0.05), dorado);
  hebilla.position.set(0, 0.24, 0.45);
  const botones = [0.4, 0.52].map(y => {
    const b = esfera(0.035, blanco, 12);
    b.position.set(0, y, 0.4 - (y - 0.4) * 0.6);
    return b;
  });
  // Colita (para cuando da la espalda)
  const pompon = esfera(0.09, blanco, 16);
  pompon.position.set(0, 0.12, -0.38);
  cadera.add(panza, borde, cinturon, hebilla, pompon, ...botones);

  // Brazos
  function brazo(lado) {
    const hombro = new THREE.Group();
    hombro.position.set(0.36 * lado, 0.47, 0);
    const manga = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.3, 14), rojo);
    manga.position.y = -0.15;
    const puno = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.035, 8, 20), blanco);
    puno.rotation.x = Math.PI / 2;
    puno.position.y = -0.3;
    const guante = esfera(0.1, verde, 16);
    guante.position.y = -0.38;
    hombro.add(manga, puno, guante);
    cadera.add(hombro);
    return hombro;
  }
  const brazoIzq = brazo(-1);
  const brazoDer = brazo(1);

  // Cabeza (bien grande, estilo chibi)
  const cabeza = new THREE.Group();
  cabeza.position.y = 0.72;
  cadera.add(cabeza);

  const cara = esfera(0.4, piel, 32);
  cara.position.y = 0.32;
  const barba = esfera(0.36, blanco, 28);
  barba.scale.set(1.05, 0.85, 0.8);
  barba.position.set(0, -0.02, 0.1);
  const bigoteIzq = esfera(0.1, blanco, 16);
  bigoteIzq.scale.set(1.5, 0.75, 0.9);
  bigoteIzq.position.set(-0.1, 0.25, 0.37);
  bigoteIzq.rotation.z = 0.35;
  const bigoteDer = bigoteIzq.clone();
  bigoteDer.position.x = 0.1;
  bigoteDer.rotation.z = -0.35;
  const nariz = esfera(0.065, mat(0xff9e86), 16);
  nariz.position.set(0, 0.31, 0.41);
  const mejillaIzq = esfera(0.07, rosa, 12);
  mejillaIzq.scale.set(1, 0.6, 0.4);
  mejillaIzq.position.set(-0.22, 0.32, 0.31);
  const mejillaDer = mejillaIzq.clone();
  mejillaDer.position.x = 0.22;

  function ojo(x) {
    const g = new THREE.Group();
    g.position.set(x, 0.43, 0.35);
    const o = esfera(0.055, negro, 16);
    o.scale.set(0.85, 1.15, 0.6);
    const brillo = esfera(0.018, blanco, 8);
    brillo.position.set(0.018, 0.025, 0.03);
    g.add(o, brillo);
    return g;
  }
  const ojoIzq = ojo(-0.13);
  const ojoDer = ojo(0.13);
  const cejaIzq = esfera(0.05, blanco, 12);
  cejaIzq.scale.set(1.3, 0.45, 0.5);
  cejaIzq.rotation.z = 0.25;
  cejaIzq.position.set(-0.13, 0.53, 0.34);
  const cejaDer = cejaIzq.clone();
  cejaDer.rotation.z = -0.25;
  cejaDer.position.x = 0.13;
  cabeza.add(cara, barba, bigoteIzq, bigoteDer, nariz, mejillaIzq, mejillaDer, ojoIzq, ojoDer, cejaIzq, cejaDer);

  // Gorro con punta que se bambolea
  const gorro = new THREE.Group();
  gorro.position.y = 0.55;
  gorro.rotation.z = -0.12;
  cabeza.add(gorro);
  const banda = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.085, 12, 40), blanco);
  banda.rotation.x = Math.PI / 2;
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.37, 0.25, 28), rojo);
  base.position.y = 0.12;
  const punta = new THREE.Group();
  punta.position.y = 0.24;
  const cono = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.45, 24), rojo);
  cono.position.y = 0.2;
  const bolita = esfera(0.085, blanco, 16);
  bolita.position.y = 0.44;
  punta.add(cono, bolita);
  gorro.add(banda, base, punta);

  // ---------- Tamaño ----------
  function ajustar() {
    const w = canvas.clientWidth || 260;
    const h = canvas.clientHeight || 260;
    renderer.setSize(w, h, false);
    camara.aspect = w / h;
    camara.updateProjectionMatrix();
  }
  ajustar();
  window.addEventListener("resize", ajustar);

  // ---------- Toque: giro con salto ----------
  let giroExtra = 0;     // vueltas extra pendientes (en radianes)
  let saltoHasta = 0;
  contenedor.addEventListener("click", () => {
    giroExtra += Math.PI * 2;
    saltoHasta = reloj.getElapsedTime() + 0.6;
  });

  // ---------- Baile ----------
  const reloj = new THREE.Clock();
  const BPM = 116;
  const PI2 = Math.PI * 2;
  let anguloExtra = 0;

  function bailar(t, dt) {
    const b = (t * BPM) / 60;              // tiempo en "beats"
    const fase = b * PI2;                  // una vuelta por beat
    const parte = Math.floor(b / 8) % 3;   // cambia de paso cada 8 beats

    // Camina en círculo por la pista
    const ang = t * 0.9;
    santa.position.set(Math.sin(ang) * 0.42, 0, Math.cos(ang) * 0.22);

    // Gira sobre sí mismo (y mucho más si lo tocaste)
    if (giroExtra > 0) {
      const paso = Math.min(giroExtra, dt * 14);
      giroExtra -= paso;
      anguloExtra += paso;
    }
    const mirar = parte === 1 ? b * 0.9 : Math.sin(b * 0.5) * 0.9; // en la parte 1 da vueltas
    santa.rotation.y = mirar + anguloExtra;

    // Rebote con aplastado y estirado
    const salto = Math.abs(Math.sin(fase / 2));
    const saltoGrande = t < saltoHasta ? Math.sin(((saltoHasta - t) / 0.6) * Math.PI) * 0.45 : 0;
    rebote.position.y = salto * 0.1 + saltoGrande;
    rebote.scale.set(1 + (1 - salto) * 0.06, 1 - (1 - salto) * 0.08, 1 + (1 - salto) * 0.06);

    // Meneo de cadera (el perreo navideño 🎅)
    const meneo = Math.sin(fase * 2);
    if (parte === 2) {
      // de espaldas, colita para arriba y meneo rápido
      cadera.rotation.x = 0.35 + meneo * 0.18;
      cadera.rotation.z = Math.sin(fase) * 0.12;
      santa.rotation.y = Math.PI + Math.sin(b * 0.5) * 0.4 + anguloExtra;
    } else {
      cadera.rotation.x = meneo * 0.12;
      cadera.rotation.z = Math.sin(fase) * 0.22;
    }
    cadera.rotation.y = Math.sin(fase) * 0.25;

    // La cabeza compensa y cabecea al ritmo
    cabeza.rotation.z = -cadera.rotation.z * 1.3 + Math.sin(fase * 2) * 0.06;
    cabeza.rotation.x = -cadera.rotation.x * 0.8 + Math.abs(Math.sin(fase)) * 0.12;

    // Brazos: arriba "levantando el techo" o agitando a los costados
    if (parte === 0) {
      brazoIzq.rotation.z = -2.6 + Math.sin(fase) * 0.35;
      brazoDer.rotation.z = 2.6 + Math.sin(fase) * 0.35;
      brazoIzq.rotation.x = brazoDer.rotation.x = 0;
    } else {
      brazoIzq.rotation.z = -0.9 - Math.sin(fase * 2) * 0.5;
      brazoDer.rotation.z = 0.9 - Math.sin(fase * 2) * 0.5;
      brazoIzq.rotation.x = Math.sin(fase) * 0.6;
      brazoDer.rotation.x = -Math.sin(fase) * 0.6;
    }

    // Pasitos
    piernaIzq.rotation.x = Math.max(0, Math.sin(fase)) * -0.7;
    piernaDer.rotation.x = Math.max(0, -Math.sin(fase)) * -0.7;
    piernaIzq.rotation.z = -0.08 - salto * 0.06;
    piernaDer.rotation.z = 0.08 + salto * 0.06;

    // Punta del gorro, ojos que parpadean
    punta.rotation.z = Math.sin(fase - 1) * 0.45 - 0.3;
    punta.rotation.x = Math.cos(fase - 1) * 0.25;
    const parpadeo = (t % 3.2) < 0.12 ? 0.15 : 1;
    ojoIzq.scale.y = ojoDer.scale.y = parpadeo;

    // Sombra y pista
    sombra.position.x = santa.position.x;
    sombra.position.z = santa.position.z;
    const s = 1 - salto * 0.2 - saltoGrande * 0.6;
    sombra.scale.set(s, s, s);
    pista.material.color.setHSL((t * 0.08) % 1, 0.9, 0.55);
    aro.rotation.z = t * 0.5;

    // Luces de boliche orbitando
    lucesDisco.forEach((l, i) => {
      const a = t * 1.3 + (i * PI2) / lucesDisco.length;
      l.position.set(Math.cos(a) * 2, 1.4 + Math.sin(t * 2 + i) * 0.4, Math.sin(a) * 2);
    });
  }

  // ---------- Animación (solo cuando se ve) ----------
  let visible = true;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(entradas => { visible = entradas[0].isIntersecting; }).observe(contenedor);
  }

  let anterior = 0;
  function cuadro() {
    requestAnimationFrame(cuadro);
    if (!visible || document.hidden) return;
    const t = reloj.getElapsedTime();
    const dt = Math.min(t - anterior, 0.05);
    anterior = t;
    bailar(t, dt);
    renderer.render(escena, camara);
  }

  if (quieto) {
    bailar(0.3, 0);
    renderer.render(escena, camara);
  } else {
    cuadro();
  }
})();
