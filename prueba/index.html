<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Invisible</title>
  <style>:root {
  --rojo: #c8102e;
  --rojo-oscuro: #8b0a1f;
  --verde: #1e7a46;
  --dorado: #f4c542;
  --crema: #fff8ec;
  --texto: #2b1d14;
  --gris: #7a6a58;
  --fondo-1: #0f2a1d;
  --fondo-2: #071510;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: var(--texto);
  background: radial-gradient(circle at top, var(--fondo-1), var(--fondo-2));
  overflow-x: hidden;
}

/* Capa de fondo (copos de nieve por ahora; después el Santa) */
#fondo {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.copo {
  position: absolute;
  top: -20px;
  color: #fff;
  opacity: 0.8;
  animation: caer linear infinite;
}
@keyframes caer {
  to { transform: translateY(110vh) rotate(360deg); }
}

.contenedor {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

h1 {
  text-align: center;
  color: #fff;
  font-size: 2.2rem;
  text-shadow: 0 3px 0 var(--rojo-oscuro), 0 0 18px rgba(244, 197, 66, 0.5);
  margin: 8px 0 24px;
}

.tarjeta {
  background: var(--crema);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  border: 3px solid var(--dorado);
}

.oculto { display: none; }

/* ¿Quién sos? */
.etiqueta {
  display: block;
  font-weight: 700;
  color: var(--verde);
  margin-bottom: 8px;
  font-size: 1.1rem;
}
/* Menú de nombres */
.selector {
  position: relative;
  margin-bottom: 18px;
  text-align: left;
}

.selector-boton {
  --c: var(--verde);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 10px 16px;
  font: inherit;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--texto);
  background: #fff;
  border: 2px solid var(--c);
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #000), 0 0 0 0 transparent;
  transition: box-shadow 0.25s, transform 0.1s, border-color 0.25s;
}
.selector-boton:hover:not(:disabled),
.selector-boton:focus-visible {
  outline: none;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #000), 0 0 18px 2px color-mix(in srgb, var(--c) 55%, transparent);
}
.selector-boton:active:not(:disabled) { transform: translateY(2px); }
.selector-boton:disabled { cursor: wait; opacity: 0.75; }
.selector-boton.elegido { background: color-mix(in srgb, var(--c) 10%, #fff); }
.selector-boton.elegido::after { animation-duration: 2.8s; }

.selector-texto { flex: 1; }
.selector-flecha {
  font-size: 1.3rem;
  color: var(--c);
  transition: transform 0.25s;
}
.selector.abierto .selector-flecha { transform: rotate(180deg); }

.selector-lista {
  position: absolute;
  z-index: 20;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  margin: 0;
  padding: 8px;
  list-style: none;
  max-height: min(60vh, 470px);
  overflow-y: auto;
  background: #1a0f0a;
  border: 2px solid var(--dorado);
  border-radius: 16px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 24px rgba(244, 197, 66, 0.25);
  animation: lista-abrir 0.22s ease-out;
  scrollbar-width: thin;
  scrollbar-color: var(--dorado) transparent;
}
.selector-lista[hidden] { display: none; }
@keyframes lista-abrir {
  from { opacity: 0; transform: translateY(-8px) scale(0.97); }
}

.opcion {
  --c: #fff;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 6px;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 700;
  text-align: left;
  color: #fff;
  background: color-mix(in srgb, var(--c) 14%, #1a0f0a);
  border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent);
  border-radius: 12px;
  cursor: pointer;
  opacity: 0;
  animation: opcion-entrar 0.3s ease-out forwards;
  animation-delay: calc(var(--i) * 35ms);
  transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
}
.opcion:last-child { margin-bottom: 0; }
.opcion:hover,
.opcion:focus-visible {
  outline: none;
  background: color-mix(in srgb, var(--c) 32%, #1a0f0a);
  box-shadow: 0 0 16px 1px color-mix(in srgb, var(--c) 60%, transparent), inset 0 0 0 1px var(--c);
  transform: translateX(4px);
}
.opcion[aria-selected="true"] {
  background: color-mix(in srgb, var(--c) 40%, #1a0f0a);
  box-shadow: inset 0 0 0 2px var(--c);
}
@keyframes opcion-entrar {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: none; }
}

/* Barrido de luz (del color de cada nombre) */
.opcion::after,
.selector-boton.elegido::after {
  content: "";
  position: absolute;
  top: -20%;
  bottom: -20%;
  left: -45%;
  width: 40%;
  pointer-events: none;
  background: linear-gradient(100deg,
    transparent 0%,
    color-mix(in srgb, var(--c) 70%, transparent) 45%,
    rgba(255, 255, 255, 0.85) 50%,
    color-mix(in srgb, var(--c) 70%, transparent) 55%,
    transparent 100%);
  transform: skewX(-18deg);
  mix-blend-mode: screen;
  animation: barrido 2.2s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * 0.18s);
}
.selector-boton.elegido::after { mix-blend-mode: normal; opacity: 0.55; }
@keyframes barrido {
  0% { left: -45%; }
  55%, 100% { left: 120%; }
}

.inicial {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 1rem;
  font-weight: 800;
  color: #1a0f0a;
  background: var(--c);
  box-shadow: 0 0 12px color-mix(in srgb, var(--c) 80%, transparent);
}
.inicial.oculto { display: none; }

/* Botones */
.btn {
  border: none;
  cursor: pointer;
  font-weight: 700;
  border-radius: 10px;
  transition: transform 0.1s, filter 0.2s;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-principal {
  display: block;
  width: 100%;
  background: var(--rojo);
  color: #fff;
  font-size: 1.4rem;
  padding: 16px;
  box-shadow: 0 5px 0 var(--rojo-oscuro);
}
.btn-principal:hover:not(:disabled) { filter: brightness(1.1); }
.btn-principal:active:not(:disabled) { box-shadow: 0 2px 0 var(--rojo-oscuro); transform: translateY(3px); }

/* Ruleta */
.tarjeta-sorteo { text-align: center; }

.ruleta {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  border-radius: 12px;
  background: repeating-linear-gradient(45deg, var(--rojo) 0 14px, #fff 14px 28px);
  padding: 8px;
}
#nombre-actual {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background: var(--crema);
  border-radius: 8px;
  font-size: 2rem;
  font-weight: 800;
  color: var(--texto);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 10px;
}
.ruleta.girando #nombre-actual { color: #9a8a78; }
.ruleta.ganador #nombre-actual {
  color: var(--rojo);
  animation: pop 0.5s ease-out;
}
.ruleta.ganador {
  animation: brillo 1s ease-in-out 3;
}
@keyframes pop {
  0% { transform: scale(0.6); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
@keyframes brillo {
  50% { box-shadow: 0 0 30px 8px var(--dorado); }
}

.mensaje {
  min-height: 1.4em;
  margin: 16px 0 0;
  font-weight: 600;
  color: var(--verde);
}
.mensaje.error { color: var(--rojo); }

.aviso-demo {
  text-align: center;
  color: var(--dorado);
  font-size: 0.85rem;
}

/* Mini Santa: vive abajo de la tarjeta, salta, se agarra del borde y se cae */
.santa-baile {
  position: relative;
  z-index: 2;                 /* por encima de la tarjeta, para que se vean las manos agarrando el borde */
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 260px;
  margin: 0 0 8px;
  -webkit-tap-highlight-color: transparent;
}
.santa-svg { max-width: 60vw; height: auto; overflow: visible; }

/* El lienzo 3D sube por detrás del borde de la tarjeta; no tapa clics */
.santa-3d {
  display: none;
  position: absolute;
  left: 0;
  top: -150px;
  width: 100%;
  height: 410px;
  pointer-events: none;
}
.santa-baile.con-3d { cursor: pointer; }
.santa-baile.con-3d .santa-svg { display: none; }
.santa-baile.con-3d .santa-3d { display: block; }

/* Santa plano de respaldo (si el navegador no tiene 3D): se balancea tranquilo */
.santa { transform-origin: 100px 230px; animation: santa-respira 1.6s ease-in-out infinite alternate; }
.sombra { fill: rgba(0, 0, 0, 0.35); }
.ojo { transform-box: fill-box; transform-origin: center; animation: parpadeo 3.5s infinite; }

@keyframes santa-respira {
  from { transform: translateY(0) rotate(-2deg); }
  to { transform: translateY(-4px) rotate(2deg); }
}
@keyframes parpadeo {
  0%, 92%, 100% { transform: scaleY(1); }
  95% { transform: scaleY(0.1); }
}

@media (prefers-reduced-motion: reduce) {
  .santa, .ojo,
  .opcion::after, .selector-boton.elegido::after { animation: none; }
  .opcion { opacity: 1; animation: none; }
}

/* Confeti */
.confeti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 14px;
  z-index: 10;
  pointer-events: none;
  animation: confeti-caer 2.5s ease-in forwards;
}
@keyframes confeti-caer {
  to { transform: translateY(105vh) rotate(720deg); opacity: 0.7; }
}
</style>
</head>
<body>
  <!-- Fondo: copos de nieve -->
  <div id="fondo" aria-hidden="true"></div>

  <main class="contenedor">
    <h1>🎁 Amigo Invisible 🎁</h1>

    <section class="tarjeta tarjeta-sorteo">
      <p id="etiqueta-quien" class="etiqueta">¿Quién sos?</p>
      <div id="selector" class="selector">
        <button type="button" id="selector-boton" class="selector-boton"
                aria-haspopup="listbox" aria-expanded="false" aria-labelledby="etiqueta-quien selector-texto" disabled>

          <!-- Cabeza -->
          <g class="cabeza">

  <script>// =====================================================
// CONFIGURACIÓN
// Pegá acá la URL de tu Apps Script (termina en /exec).
// Si queda vacía, la web funciona en "modo prueba" con nombres de ejemplo.
// =====================================================
const SCRIPT_URL = "";

const MODO_DEMO = !SCRIPT_URL;
const CLAVE_RESULTADO = "amigo-invisible-resultado";

// ---------- Elementos ----------
const selector = document.getElementById("selector");
const selectorBoton = document.getElementById("selector-boton");
const selectorTexto = document.getElementById("selector-texto");
const selectorInicial = document.getElementById("selector-inicial");
const selectorLista = document.getElementById("selector-lista");
const ruleta = document.getElementById("ruleta");
const nombreActual = document.getElementById("nombre-actual");
const btnSortear = document.getElementById("btn-sortear");
const mensaje = document.getElementById("mensaje");
const avisoDemo = document.getElementById("aviso-demo");

let participantes = [];
let quienElegido = "";

// Un color de luz distinto para cada nombre (se repiten si hay más de 12).
const COLORES_NOMBRES = [
  "#ff4d6d", "#ffc93c", "#3ddc84", "#4fd1ff", "#b388ff", "#ff8a3d",
  "#ff6fb5", "#7cf5e0", "#c6ff4d", "#6e8bff", "#ff5ce1", "#ffe066",
];
function colorDe(nombre) {
  const i = participantes.indexOf(nombre);
  return COLORES_NOMBRES[(i < 0 ? 0 : i) % COLORES_NOMBRES.length];
}

// ---------- Comunicación con el Apps Script ----------
async function api(params) {
  if (MODO_DEMO) return apiDemo(params);
  const url = SCRIPT_URL + "?" + new URLSearchParams(params);
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("El servidor respondió " + resp.status);
  return resp.json();
}

// Simulación local para probar sin Apps Script
const demo = { nombres: ["Fernando","Juani","Flor","Alejandra","Beti","Nacho","Daniela","Ezequiel","Caro","Charli"], asignaciones: null, sorteados: [] };
async function apiDemo(params) {
  await new Promise(r => setTimeout(r, 800));
  if (params.accion === "participantes") return { ok: true, participantes: demo.nombres };
  if (params.accion === "sortear") {
    if (!demo.asignaciones) {
      const s = [...demo.nombres].sort(() => Math.random() - 0.5);
      demo.asignaciones = {};
      s.forEach((n, i) => { demo.asignaciones[n] = s[(i + 1) % s.length]; });
    }
    if (demo.sorteados.includes(params.nombre)) return { ok: true, yaSorteo: true };
    demo.sorteados.push(params.nombre);
    console.log(`[demo] Mail al organizador: "${params.nombre} ya hizo su sorteo (${demo.sorteados.length} de ${demo.nombres.length})"`);
    return { ok: true, yaSorteo: false, teToca: demo.asignaciones[params.nombre] };
  }
  return { ok: false, error: "Acción desconocida" };
}

// ---------- Guardado local del resultado ----------
function leerResultado() {
  try { return JSON.parse(localStorage.getItem(CLAVE_RESULTADO)); } catch (e) { return null; }
}
function guardarResultado(nombre, teToca) {
  try { localStorage.setItem(CLAVE_RESULTADO, JSON.stringify({ nombre, teToca })); } catch (e) { /* ignorar */ }
}

// ---------- UI ----------
function mostrarMensaje(texto, esError = false) {
  mensaje.textContent = texto;
  mensaje.classList.toggle("error", esError);
}

function aleatorio(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function mostrarGanador(nombre) {
  nombreActual.textContent = nombre;
  ruleta.classList.remove("girando");
  void ruleta.offsetWidth; // reinicia la animación
  ruleta.classList.add("ganador");
}

// Hace girar los nombres hasta que se llame a parar(nombreFinal).
// Gira rápido mientras espera la respuesta y después frena de a poco.
function girar(nombresGiro) {
  let delay = 50;
  let final = null;
  let frenando = false;
  let cancelado = false;
  let anterior = null;
  let resolver;
  const inicio = Date.now();
  const terminado = new Promise(r => (resolver = r));

  ruleta.classList.remove("ganador");
  ruleta.classList.add("girando");

  function tick() {
    if (cancelado) return;
    if (frenando && delay >= 450) {
      mostrarGanador(final);
      resolver();
      return;
    }
    let n = aleatorio(nombresGiro);
    if (nombresGiro.length > 1) while (n === anterior) n = aleatorio(nombresGiro);
    anterior = n;
    nombreActual.textContent = n;

    if (frenando) delay *= 1.12;
    else if (final !== null && Date.now() - inicio > 1500) frenando = true;
    setTimeout(tick, delay);
  }
  tick();

  return {
    parar(nombreFinal) { final = nombreFinal; return terminado; },
    cancelar(texto) {
      cancelado = true;
      ruleta.classList.remove("girando");
      nombreActual.textContent = texto;
    },
  };
}

function bloquear() {
  cerrarLista();
  selectorBoton.disabled = true;
  btnSortear.disabled = true;
}

// ---------- Menú de nombres ----------
function armarLista() {
  selectorLista.innerHTML = "";
  participantes.forEach((n, i) => {
    const li = document.createElement("li");
    li.setAttribute("role", "presentation");
    const op = document.createElement("button");
    op.type = "button";
    op.className = "opcion";
    op.setAttribute("role", "option");
    op.setAttribute("aria-selected", "false");
    op.dataset.nombre = n;
    op.style.setProperty("--c", colorDe(n));
    op.style.setProperty("--i", i);
    op.innerHTML = '<span class="inicial"></span><span></span>';
    op.firstChild.textContent = n.charAt(0).toUpperCase();
    op.lastChild.textContent = n;
    op.addEventListener("click", () => elegir(n, true));
    li.appendChild(op);
    selectorLista.appendChild(li);
  });
}

function opciones() {
  return [...selectorLista.querySelectorAll(".opcion")];
}

function abrirLista() {
  if (selectorBoton.disabled) return;
  selectorLista.hidden = false;
  selector.classList.add("abierto");
  selectorBoton.setAttribute("aria-expanded", "true");
  // Reinicia la animación de entrada de cada nombre
  opciones().forEach(op => { op.style.animation = "none"; void op.offsetWidth; op.style.animation = ""; });
  const actual = opciones().find(op => op.dataset.nombre === quienElegido) || opciones()[0];
  if (actual) actual.focus({ preventScroll: true });
}

function cerrarLista(volverAlBoton = false) {
  if (selectorLista.hidden) return;
  selectorLista.hidden = true;
  selector.classList.remove("abierto");
  selectorBoton.setAttribute("aria-expanded", "false");
  if (volverAlBoton) selectorBoton.focus();
}

function elegir(nombre, desdeLista = false) {
  quienElegido = nombre;
  const color = colorDe(nombre);
  selectorTexto.textContent = nombre;
  selectorInicial.textContent = nombre.charAt(0).toUpperCase();
  selectorInicial.classList.remove("oculto");
  selectorBoton.style.setProperty("--c", color);
  selectorBoton.classList.add("elegido");

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {

  }

  const i = ops.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); ops[(i + 1) % ops.length].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); ops[(i - 1 + ops.length) % ops.length].focus(); }
  else if (e.key === "Home") { e.preventDefault(); ops[0].focus(); }
  else if (e.key === "End") { e.preventDefault(); ops[ops.length - 1].focus(); }

});

document.addEventListener("click", e => {

// ---------- Sorteo ----------
async function sortear() {
  const quien = quienElegido;
  if (!quien) {
    mostrarMensaje("Primero elegí tu nombre 👆", true);
    return;
  }
  bloquear();
  mostrarMensaje("");

  const otros = participantes.filter(n => n !== quien);
  const giro = girar(otros.length ? otros : participantes);

  try {
    const res = await api({ accion: "sortear", nombre: quien });
    if (!res.ok) throw new Error(res.error || "Algo salió mal");

    if (res.yaSorteo) {
      giro.cancelar("🤔");
      mostrarMensaje(`${quien}, vos ya hiciste tu sorteo. Si no fuiste vos, avisale al organizador.`, true);
      return;
    }

    await giro.parar(res.teToca);
    guardarResultado(quien, res.teToca);
    mostrarMensaje(`¡${quien}, te toca regalarle a ${res.teToca}! 🤫 No le digas a nadie.`);
    lanzarConfeti();
  } catch (err) {
    giro.cancelar("😕");
    mostrarMensaje("No se pudo sortear: " + err.message + ". Probá de nuevo.", true);
    selectorBoton.disabled = false;
    btnSortear.disabled = false;
  }
}

function lanzarConfeti() {
  const colores = ["#c8102e", "#1e7a46", "#f4c542", "#ffffff"];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confeti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = aleatorio(colores);
    c.style.animationDelay = Math.random() * 0.6 + "s";
    c.style.animationDuration = 2 + Math.random() * 1.5 + "s";

    setTimeout(() => c.remove(), 4500);
  }
}

function crearNieve() {
  const fondo = document.getElementById("fondo");
  for (let i = 0; i < 40; i++) {
    const copo = document.createElement("span");
    copo.className = "copo";
    copo.textContent = "❄";

}

// ---------- Inicio ----------
async function iniciar() {
  crearNieve();
  avisoDemo.classList.toggle("oculto", !MODO_DEMO);

  // Si este dispositivo ya sorteó, mostrar el resultado directamente
  const previo = leerResultado();

    const res = await api({ accion: "participantes" });

  selectorBoton.disabled = false;
  btnSortear.disabled = false;
}

  const clamp01 = x => Math.min(1, Math.max(0, x));
  const salida = k => 1 - (1 - k) * (1 - k);     // rápido al principio, frena al final
  const entrada = k => k * k;                     // arranca lento y acelera (caída)
  const suave = k => k * k * (3 - 2 * k);         // suave al principio y al final
  const lomo = (u, desde, dura, alto) => (u > desde && u < desde + dura ? Math.sin(((u - desde) / dura) * PI) * alto : 0);
  const prog = (c, a, b) => clamp01((c - a) / (b - a));

  const NEUTRO = {
    giro: 0, tumbo: 0, colgZ: 0, colgX: 0, cX: 0, cZ: 0, hX: 0, hZ: 0,
    aIX: 0, aIZ: -0.25, aDX: 0, aDZ: 0.25,
    pIX: 0, pIZ: -0.08, pDX: 0, pDZ: 0.08,
    ojos: 1,
  };
  const actual = Object.assign({}, NEUTRO);
  const BRAZOS_ARRIBA = 2.95;
  const TORSO_EN_EL_PISO = -0.27;   // altura del cuerpo sin piernas, apoyado en el piso

  // ---------- Baile final ----------
  // (Provisorio: acá va el baile que pida el usuario.)
  function baileFinal(u, p) {
    const beat = u * 2.2 * PI;
    p.giro = Math.sin(u * 1.1) * 0.5;
    p.cZ = Math.sin(beat) * 0.18;
    p.hZ = -Math.sin(beat) * 0.12;
    p.aIZ = -1.2 - Math.sin(beat) * 0.6;
    p.aDZ = 1.2 - Math.sin(beat) * 0.6;
    p.pIX = Math.max(0, Math.sin(beat)) * -0.5;
    p.pDX = Math.max(0, -Math.sin(beat)) * -0.5;
    return Math.abs(Math.sin(beat)) * 0.08;      // altura del saltito
  }

  function escenaEn(c, alturaColgado) {
    // Devuelve la pose objetivo, la altura (y) y el aplastado para el momento c del ciclo
    const p = Object.assign({}, NEUTRO);
    let y = 0, aplaste = 0, rapido = false;

    if (c < T.vuelta) {
      // Mira la tarjeta, respira y da saltitos de ganas
      p.hX = -0.38;
      aplaste = Math.sin(c * 4) * 0.015;
      y = lomo(c, 1.1, 0.3, 0.07) + lomo(c, 1.45, 0.3, 0.07);
      p.aIZ = -0.35; p.aDZ = 0.35;
    } else if (c < T.agacha) {
      // Se da vuelta para quedar de espaldas, mirando la tarjeta
      p.giro = PI;
      p.hX = -0.3;
      y = lomo(c, T.vuelta, 0.3, 0.08);
    } else if (c < T.salta) {
      // Se agacha para tomar impulso
      const k = salida(prog(c, T.agacha, T.salta));
      p.giro = PI;
      aplaste = 0.2 * k;
      p.cX = 0.25; p.hX = -0.45;
      p.aIX = 0.7; p.aDX = 0.7; p.aIZ = -0.4; p.aDZ = 0.4;
      p.pIZ = -0.16; p.pDZ = 0.16;
      rapido = true;
    } else if (c < T.agarra) {
      // ¡Salta de espaldas!
      const k = prog(c, T.salta, T.agarra);
      p.giro = PI;
      y = alturaColgado * salida(k);
      aplaste = -0.14 * (1 - k);
      p.aIZ = -BRAZOS_ARRIBA; p.aDZ = BRAZOS_ARRIBA;
      p.pIX = 0.35; p.pDX = 0.2; p.hX = -0.3;
      rapido = true;
    } else if (c < T.cuelga) {
      // Se agarra del borde con un tironcito
      const k = prog(c, T.agarra, T.cuelga);
      p.giro = PI;
      y = alturaColgado - Math.sin(k * PI) * 0.06;
      p.aIZ = -BRAZOS_ARRIBA; p.aDZ = BRAZOS_ARRIBA;
      p.pIX = -0.3; p.pDX = 0.3;
      rapido = true;
    } else if (c < T.resbala) {
      // Colgado: patalea, se balancea e intenta subir dos veces
      const u = c - T.cuelga;
      p.giro = PI;
      y = alturaColgado + lomo(u, 0.7, 0.55, 0.1) + lomo(u, 1.6, 0.55, 0.12);
      p.colgZ = Math.sin(u * 3.2) * 0.1;
      p.aIZ = -BRAZOS_ARRIBA; p.aDZ = BRAZOS_ARRIBA;
      p.pIX = Math.sin(u * 12) * 0.55; p.pDX = -Math.sin(u * 12) * 0.55;
      p.pIZ = -0.12; p.pDZ = 0.12;
      p.hX = -0.1;
    } else if (c < T.cae) {
      // Se le resbala una mano y manotea
      const k = prog(c, T.resbala, T.cae);
      p.giro = PI;
      y = alturaColgado - 0.05 * k;
      p.colgZ = -0.32 * salida(k) + Math.sin(c * 22) * 0.04;
      p.aIZ = -1.4 + Math.sin(c * 30) * 0.5; p.aIX = Math.sin(c * 26) * 0.4;
      p.aDZ = BRAZOS_ARRIBA;
      p.pIX = Math.sin(c * 18) * 0.7; p.pDX = -Math.sin(c * 18) * 0.7;
      p.ojos = 1.35;
      rapido = true;
    } else if (c < T.golpe) {
      // Se cae
      const k = prog(c, T.cae, T.golpe);
      p.giro = PI + k * 0.6;
      y = (alturaColgado - 0.05) * (1 - entrada(k));
      p.aIZ = -2.4 + Math.sin(c * 25) * 0.45; p.aDZ = 2.4 + Math.sin(c * 25 + 1.3) * 0.45;
      p.pIX = -0.6; p.pDX = 0.4;
      p.ojos = 1.4;
      rapido = true;
    } else if (c < T.rearma) {
      // ¡Pum! Se desarmó: el cuerpo queda en el piso, medio de costado
      const u = c - T.golpe;
      p.giro = PI + 0.6;
      p.tumbo = 0.35;
      y = TORSO_EN_EL_PISO + Math.max(0, Math.sin(Math.min(u / 0.35, 1) * PI)) * 0.25 * Math.max(0, 1 - u / 0.35);
      aplaste = Math.max(0, 0.18 * (1 - u / 0.25));
      rapido = true;
    } else if (c < T.festeja) {
      // Las piezas vuelven volando; el cuerpo se endereza y mira para adelante
      const k = prog(c, T.rearma, T.festeja);
      p.giro = 0;
      y = TORSO_EN_EL_PISO * (1 - suave(clamp01(k / 0.45)));
      p.ojos = 1.2;
    } else if (c < T.baile) {
      // ¡Ta-dá!
      const k = prog(c, T.festeja, T.baile);
      y = lomo(k, 0, 1, 0.22);
      p.aIZ = -2.5; p.aDZ = 2.5;
      p.hX = -0.15;
      aplaste = k > 0.9 ? 0.06 : 0;
      p.ojos = 1.1;
    } else {
      // Baile final
      y = baileFinal(c - T.baile, p);
    }
    return { p, y, aplaste, rapido };
  }

  // ---------- Animar ----------
  let cAnterior = 0;
  function animar(t, dt) {
    medir();
    const alturaColgado = bordeY - 0.03 - ALTURA_MANOS - pisoY;   // cuánto sube hasta agarrarse

    // Si la tarjeta muestra el resultado del sorteo, no se cuelga para no taparlo: baila.
    let c = (t - inicio) % CICLO;
    if (c >= T.vuelta && cAnterior < T.vuelta && ruleta && ruleta.classList.contains("ganador")) {
      inicio = t - T.baile;
      c = T.baile;
    }

    // Eventos: desarmarse al tocar el piso, rearmarse después
    const enPiezas = c >= T.golpe && c < T.festeja;
    if (enPiezas && estado === "armado" && c < T.rearma) desarmar();
    if (estado === "desarmado" && c >= T.rearma && c < T.festeja) empezarRearmado();
    if (!enPiezas && estado !== "armado") terminarRearmado();
    cAnterior = c;

    const { p: objetivo, y, aplaste, rapido } = escenaEn(c, alturaColgado);

    // Pasar suave a la pose (más rápido en los momentos bruscos)
    const k = dt === 0 ? 1 : 1 - Math.exp(-dt * (rapido ? 24 : 11));
    for (const clave in objetivo) actual[clave] += (objetivo[clave] - actual[clave]) * k;
    const p = actual;

    santa.position.set(0, pisoY + y, 0);
    santa.rotation.set(0, p.giro, p.tumbo);
    colgador.rotation.set(p.colgX, 0, p.colgZ);
    cuerpo.scale.set(1 + aplaste * 0.6, 1 - aplaste, 1 + aplaste * 0.6);
    cadera.rotation.set(p.cX, 0, p.cZ);

    if (estado === "armado") {
      cabeza.rotation.set(p.hX, 0, p.hZ);
      brazoIzq.rotation.set(p.aIX, 0, p.aIZ);
      brazoDer.rotation.set(p.aDX, 0, p.aDZ);
      piernaIzq.rotation.set(p.pIX, 0, p.pIZ);
      piernaDer.rotation.set(p.pDX, 0, p.pDZ);
      gorro.rotation.set(0, 0, -0.12);
    } else if (estado === "desarmado") {
      moverPiezas(dt, anchoMundo / 2 - 0.35);
    } else {
      rearmar(prog(c, T.rearma, T.festeja));
    }

    // Ojos: parpadeo y ojos grandes del susto
    const parpadeo = (t % 3.2) < 0.12 ? 0.15 : 1;
    [ojoIzq, ojoDer].forEach(o => o.scale.set(p.ojos, p.ojos * parpadeo, p.ojos));

    // Punta del gorro
    punta.rotation.z = Math.sin(t * 3) * 0.25 - 0.3;
    punta.rotation.x = Math.cos(t * 3) * 0.12;

    // Estrellitas girando sobre la cabeza tirada en el piso
    const mostrarEstrellas = estado === "desarmado" && c > T.golpe + 0.5;
    if (mostrarEstrellas) {
      cabeza.updateMatrixWorld(true);
      v.set(0, 0.3, 0);
      cabeza.localToWorld(v);
    }
    estrellas.forEach((e, i) => {
      e.visible = mostrarEstrellas;
      if (!mostrarEstrellas) return;
      const a = t * 4 + (i * PI * 2) / estrellas.length;
      e.position.set(v.x + Math.cos(a) * 0.5, v.y + 0.55 + Math.sin(a * 2) * 0.05, v.z + Math.sin(a) * 0.35);
      e.lookAt(camara.position);
      e.rotation.z += t * 3;
    });

    // Sombra en el piso: más chica y suave cuanto más alto está
    sombra.position.set(santa.position.x, pisoY + 0.002, 0);
    const alto = Math.max(0, y);
    const s = Math.max(0.25, 1 - alto * 0.35);
    sombra.scale.set(s, s, s);
    sombra.material.opacity = Math.max(0.25, 1 - alto * 0.3);
  }

  // ---------- Bucle (solo cuando se ve) ----------
  let visible = true;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(entradas => { visible = entradas[0].isIntersecting; }).observe(contenedor);
  }

  let anterior = 0;
  function cuadro() {
    requestAnimationFrame(cuadro);
    if (!visible || document.hidden) return;
    const t = reloj.getElapsedTime();
    const dt = Math.min(t - anterior, 0.05);
    anterior = t;
    animar(t, dt);
    renderer.render(escena, camara);
  }

  if (quieto) {
    animar(0.5, 0);
    renderer.render(escena, camara);
  } else {
    cuadro();
  }
})();
</script>
</body>
</html>
